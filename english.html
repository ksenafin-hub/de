<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Words A1–B1 — тренажёр английских слов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12151c;--card:#1a1f2a;--card2:#222939;--line:#2c3547;
  --text:#edf1f7;--mut:#8f9cb1;
  --acc:#f2c94c;--accDim:#7a621c;
  --der:#6aa9ff;--die:#ff7d95;--das:#4fce8d;
  --ok:#3fbf7f;--bad:#e5606c;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit}
.serif{font-family:'Spectral',Georgia,serif}
header{padding:18px 16px 4px;max-width:640px;margin:0 auto}
.wm{font-size:27px;font-weight:600;letter-spacing:.3px}
.wm b{color:var(--acc);font-weight:600}
.wmSub{color:var(--mut);font-size:12.5px;margin-top:2px}
#tabs{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:10px 12px;max-width:640px;margin:0 auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:1px solid transparent;color:var(--mut);padding:7px 13px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab.act{color:var(--text);background:var(--card);border-color:var(--line)}
.badge{background:var(--acc);color:#1a1405;border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px}
main{max-width:640px;margin:0 auto;padding:8px 16px 90px}
.pageT{font-size:20px;font-weight:800;margin:10px 0 12px}
.eyebrow{color:var(--mut);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center;margin:8px 0 14px}
.heroN{font-size:56px;font-weight:800;line-height:1.1;margin-top:6px}
.heroSub{color:var(--mut);margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px;margin:0 0 12px}
.card.warn{border-color:#5a4620;background:#241f14;color:#e8d9a8;font-size:14px}
.cardT{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:2px 0 10px}
.cardT.left{text-align:left;margin-top:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.head{margin:8px 0 4px}
.row.gap{margin-bottom:10px}
.grow{flex:1 1 auto;min-width:0}
.sel{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px;max-width:100%}
.sel.full{width:100%;margin-bottom:10px}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#1a1405}
.btn.big{width:100%;padding:14px;font-size:16px;margin-top:6px}
.btn.danger{border-color:#5c3138;color:#ff9aa4}
.icoBtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;flex:0 0 auto;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.bigPlay{background:var(--card2);border:1px solid var(--line);border-radius:99px;width:84px;height:84px;font-size:34px;cursor:pointer;margin:8px auto 6px;display:flex;align-items:center;justify-content:center}
.mut{color:var(--mut)}
.sm{font-size:13px;margin-top:8px}
.xs{font-size:10.5px}
.center{text-align:center}
.trio{display:flex;text-align:center}
.trio>div{flex:1}
.trio b{display:block;font-size:24px;font-weight:800}
.trio span{color:var(--mut);font-size:12.5px}
.trio.wide{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 8px;margin-bottom:12px}
.art{font-weight:600}
.a-der{color:var(--der)}.a-die{color:var(--die)}.a-das{color:var(--das)}
.catGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catCard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cIco{font-size:20px}
.cName{font-weight:600;font-size:14px}
.cNum{color:var(--mut);font-size:12px}
.pbar{position:relative;display:block;height:5px;border-radius:99px;background:#2a3141;overflow:hidden;margin-top:7px;width:100%}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accDim);border-radius:99px}
.pbar i.pm{background:var(--acc)}
.wlist{margin-top:10px}
.wrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #1f2532}
.wmain{flex:1;min-width:0}
.wde{font-size:17px}
.wru{color:var(--mut);font-size:13.5px}
.chip.adv{opacity:.7}
.chip .lvl{font-size:9.5px;font-weight:700;letter-spacing:.08em;margin-left:5px;
  padding:1px 4px;border-radius:6px;background:#9C2B23;color:#fff;vertical-align:middle}
.prepBox{text-align:center;padding:20px 8px 10px}
.prepBig{font-size:40px;font-weight:600;letter-spacing:.02em}
.prepSent{font-size:21px;line-height:1.5}
.prepSent .gap{font-weight:700;border-bottom:2px solid currentColor;padding:0 4px}
.prepTag{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut,#888);margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.opt{font-size:17px;padding:15px 10px;border-radius:10px;cursor:pointer;
  border:1.5px solid var(--line,#999);background:var(--bg2,#fff);color:inherit}
.opt.good{border-color:#2c7a4b;background:#2c7a4b22}
.opt.bad{border-color:#b3382f;background:#b3382f22}
.rangeRow{display:flex;gap:12px;margin:8px 0 10px;flex-wrap:wrap}
.rangeRow label{font-size:13px;color:var(--mut,#888);display:flex;align-items:center;gap:6px}
.rangeRow input{width:92px;font-size:16px;padding:7px 9px;border-radius:8px;
  border:1.5px solid var(--line,#999);background:var(--bg2,#fff);color:inherit}
.numBox{text-align:center;padding:22px 10px 6px}
.numBig{font-size:62px;font-weight:700;letter-spacing:.04em;line-height:1}
.numPlay{font-size:46px;background:none;border:0;cursor:pointer;padding:6px 14px}
.numInp{width:100%;box-sizing:border-box;font-size:22px;text-align:center;padding:13px;
  margin:12px 0;border-radius:10px;border:1.5px solid var(--line,#999);
  background:var(--bg2,#fff);color:inherit}
.typoBox{margin:10px 0;padding:9px 11px;border-radius:8px;background:#0003;font-size:13.5px;
  display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.typoBox .btn{margin:0;font-size:12.5px;padding:6px 11px}
.pk{width:28px;height:28px;flex:0 0 auto;border:2px solid var(--line,#999);border-radius:7px;
  background:transparent;color:transparent;font-size:16px;font-weight:700;line-height:1;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;padding:0}
.pk.on{background:#4E2E78;border-color:#4E2E78;color:#fff}
.pickBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.pickBar .btn{margin:0;padding:8px 12px;font-size:13px}
.qtag{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:600;letter-spacing:.06em;
  padding:2px 7px;border-radius:9px;background:#4e2e7833;color:#c9b6e8;vertical-align:middle;text-transform:none}
.srch{width:100%;box-sizing:border-box;font-size:16px;padding:10px 12px;margin-bottom:10px;
  border:1.5px solid var(--line,#999);background:var(--bg2,#fff);color:inherit;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:12.5px;padding:6px 11px;border-radius:14px;cursor:pointer;
  border:1px solid var(--line,#999);background:transparent;color:inherit}
.chip.on{background:#4E2E78;border-color:#4E2E78;color:#fff}
.wrow.slim{padding-top:7px;padding-bottom:7px}
.accOk{color:#2c7a4b;font-weight:600;font-size:12px}
.accBad{color:#b3382f;font-weight:600;font-size:12px}
.tier{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;
  padding:1px 6px;border-radius:9px;vertical-align:middle;margin-left:6px}
.t1{background:#4E2E78;color:#fff}.t2{background:#7a5aa8;color:#fff}
.t3{background:#c9bcdd;color:#241436}.t4{background:#e2dcec;color:#4a3a5c}
.t5{background:#eceaf0;color:#7b7488}
.t6{background:#0d5c54;color:#fff}
/* --- предложения --- */
.szstat{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:10px}
.szstat b{color:var(--text);font-variant-numeric:tabular-nums}
.szcell{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:none;
  background:#1d2e2b;color:#5fcab9;border-radius:5px;padding:3px 7px;margin-left:8px;vertical-align:middle}
.szrow{padding:8px 0;border-bottom:1px solid var(--line)}
.szrow:last-child{border-bottom:none}
.szin{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--text);
  font-size:17px;padding:13px 12px;margin:12px 0 4px;font-family:inherit}
.szin:focus{outline:none;border-color:var(--acc)}
.szuser{font-size:17px;color:var(--mut);margin:10px 0 2px;word-break:break-word}
.szdiff{margin-top:12px;font-size:16px;line-height:1.9;word-break:break-word}
.szdiff .d-ok{color:var(--text)}
.szdiff .d-extra{color:#ff9aa4;text-decoration:line-through}
.szdiff .d-miss{color:#8ddcc6;text-decoration:underline;text-underline-offset:3px}
.szslot{min-height:46px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;
  background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.szpool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.szslot .chip,.szpool .chip{font-size:15px;padding:8px 13px}
.szsent{font-size:22px;line-height:1.5;margin:10px 0 2px;word-break:break-word}
.szgap{display:inline-block;min-width:62px;border-bottom:2px solid var(--acc);margin:0 2px}
.szslow{display:block;margin:0 auto 6px;font-size:13px;padding:6px 14px}
.szmode{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 0;border-top:1px solid var(--line)}
.szmode .btn{flex:0 0 auto}
.szgrp{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--mut);margin:14px 0 6px}
.szlink{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;color:var(--text)}
.szlinkN{display:block;font-size:14.5px;font-weight:600}
.szlinkM{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.szexp{font-size:14.5px;line-height:1.55}
.szex{font-size:17px;margin-bottom:2px}
.szhl{color:var(--acc)}
.szrun{display:flex;align-items:center;gap:5px;justify-content:center;margin:6px 0 2px}
.szrun i{width:9px;height:9px;border-radius:99px;border:1px solid var(--line);display:block}
.szrun i.on{background:var(--acc);border-color:var(--acc)}
.szrun span{margin-left:8px}
.szrate{display:flex;gap:8px;margin-top:14px}
.szrate .btn{flex:1}
.btn.good{border-color:#245a41;background:#12271e;color:#8ddcc6}
.btn.bad{border-color:#5c2a31;background:#291418;color:#ff9aa4}

.wnote{color:#6f7d93;font-size:12px;margin-top:1px}
.wnote.exI{font-style:italic;color:#8391a8}
.exRuI{font-style:normal;color:#66738a}
.exB{display:flex;gap:9px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:10px;text-align:left}
.exB .icoBtn{width:30px;height:30px;font-size:13px}
.exTxt{min-width:0}
.exDe{font-size:15.5px}
.exRu{color:var(--mut);font-size:12.5px;margin-top:1px}
.conjW{margin-top:7px}
.conjBtn{background:none;border:none;color:var(--acc);font-size:12.5px;font-weight:600;padding:2px 0;cursor:pointer}
.conjT{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:6px;text-align:left}
.conjT.open{margin-top:10px}
.cgrid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 8px;font-size:13.5px;align-items:baseline}
.cgrid span{color:var(--mut);font-size:11.5px;text-align:right}
.cgrid b{font-weight:600;overflow-wrap:anywhere}
.cperf{font-size:12.5px;color:#a9b4c6;margin-top:7px}
.cperf.mut2{color:#7e8ba0;margin-top:3px}
.box.mini{min-width:27px;height:20px;font-size:10px;border-radius:6px;padding:0 3px}
.tri{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
.stG{display:grid;grid-template-columns:58px repeat(7,1fr);gap:6px 3px;align-items:center;text-align:center}
.stL{font-size:11.5px;color:var(--mut);text-align:left}
.stC{font-size:12.5px;font-variant-numeric:tabular-nums}
.stC.dim0{color:#39425a}
.box.hb{margin:0 auto}
.box{flex:0 0 auto;min-width:26px;height:26px;padding:0 4px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.b0{background:#2a3141;color:#7b8699}
.b1{background:#4c2830;color:#ff98a2}
.b2{background:#4d3524;color:#ffb26b}
.b3{background:#4a3d1c;color:#f2c94c}
.b4{background:#2f4526;color:#a8d97c}
.b5{background:#1f4636;color:#5fd8a2}
.b6{background:#173f44;color:#54cfd8}
.tGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tCard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tCard b{font-size:13.5px}
.tCard span{color:var(--mut);font-size:11.5px}
.tCard.sel{border-color:var(--acc);background:#241f10}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip.on{color:var(--text);border-color:var(--acc);background:#241f10}
.ckRow{display:flex;align-items:center;gap:8px;font-size:14.5px;margin:4px 0 12px;cursor:pointer}
.lbl{display:block;font-size:13px;color:var(--mut);margin:8px 0 5px}
input[type=range].full{width:100%;margin-bottom:6px;accent-color:var(--acc)}
.io{width:100%;height:96px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:12px;padding:8px;margin-top:10px;font-family:ui-monospace,monospace}
.brow{display:flex;align-items:center;gap:10px;margin:7px 0}
.brow.sm .blbl{font-size:12.5px}
.blbl{flex:0 0 44%;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{flex:1;height:7px;border-radius:99px;background:#2a3141;overflow:hidden;position:relative}
.btrack i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:99px}
.bval{flex:0 0 auto;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.bval.err{color:var(--bad)}
.boxRow{display:flex;gap:4px;text-align:center}
.boxCol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.boxCol b{font-size:16px}
.actRow{display:flex;align-items:flex-end;gap:4px;height:96px}
.actCol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.actBar{width:100%;max-width:22px;background:var(--acc);border-radius:4px 4px 2px 2px}
.actCol span{font-size:9.5px;color:var(--mut)}
.shead{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
.sbar{flex:1;height:6px;border-radius:99px;background:#2a3141;overflow:hidden;position:relative}
.sbar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:99px;transition:width .25s}
.scount{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.stitle{text-align:center;color:var(--mut);font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:8px 0 4px}
.qde{text-align:center;font-size:34px;font-weight:600;margin:18px 0 8px}
.qru{text-align:center;font-size:24px;font-weight:600;margin:20px 0 10px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;text-align:left;cursor:pointer}
.opt .key{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--card2);color:var(--mut);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sprCard{display:inline-block;min-width:62%;border:2px solid var(--line,#999);border-radius:12px;padding:14px 18px;margin:4px 0 6px}
.sprTh{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut,#888);margin-bottom:6px}
.sprW{font-size:30px;font-weight:600}
.sprCue{font-size:22px;line-height:1.45}
.sprPic{font-size:64px;line-height:1.1}
.sprAsk{text-align:center;color:var(--mut,#888);font-size:14px;margin:12px 0 4px}
.sprGrade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.sprGrade .btn{margin:0}
.btn.bad{border-color:#b3382f;color:#e07a70}
.opt.ok{border-color:var(--ok);background:#132b21}
.opt.bad{border-color:var(--bad);background:#2e181c}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.wwrap{margin-top:14px}
.winp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:19px;padding:13px 14px;outline:none}
.winp:focus{border-color:var(--acc)}
.uml{display:flex;gap:6px;margin-top:8px}
.uch{flex:0 0 auto;width:44px;height:44px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:18px;cursor:pointer}
.uml .btn{flex:1}
.fb{border-radius:14px;padding:14px;margin-top:14px;border:1px solid}
.fb.okB{border-color:#245a41;background:#12271e}
.fb.badB{border-color:#5c2a31;background:#291418}
.fbT{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.okB .fbT{color:var(--ok)}
.badB .fbT{color:var(--bad)}
.fbW{font-size:26px;font-weight:600;margin-top:6px}
.fbR{color:var(--mut);margin-top:2px}
.fbM{color:#a9b4c6;font-size:13.5px;margin-top:5px}
.fbM.hl{color:var(--acc)}
.sum{text-align:center;padding-top:16px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 16px;text-align:center;margin:10px 0 14px}
.lde{font-size:36px;font-weight:600;margin:10px 0 2px}
.lru{font-size:19px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#0c0e13;border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:520px){.catGrid{grid-template-columns:1fr 1fr 1fr}}
.ipa{font-family:'Inter',system-ui,sans-serif;color:#8fa3c4;font-size:13px;margin-top:2px;letter-spacing:.01em}

var syncOn=false,snap={};
function localLoad(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return;
    var d=JSON.parse(raw);
    if(d&&typeof d==="object"){
      if(d.w)S.w=d.w;
      if(d.p)S.p=d.p;
      if(d.x)S.x=d.x;
      if(d.daily)S.daily=d.daily;
      if(d.set)S.set=Object.assign(S.set,d.set);
    }
  }catch(e){}
}
function localSave(){
  try{localStorage.setItem(KEY,JSON.stringify({w:S.w,p:S.p,x:S.x,daily:S.daily,set:S.set}));S.mem=false;}
  catch(e){if(!S.mem){S.mem=true;render();}}
}
function snapshot(){
  snap={};
  for(var k in S.w)snap["w:"+k]=JSON.stringify(S.w[k]);
  for(var k2 in S.p)snap["p:"+k2]=JSON.stringify(S.p[k2]);
  snap["daily"]=JSON.stringify(S.daily);
  snap["set"]=JSON.stringify(S.set);
  snap["x"]=JSON.stringify(S.x);
}
function syncPush(){
  if(!window.Progress||!syncOn)return;
  for(var k in S.w){
    var id="w:"+k,j=JSON.stringify(S.w[k]);
    if(snap[id]!==j){Progress.touch(id,{d:S.w[k]});snap[id]=j;}
  }
  for(var k2 in S.p){
    var id2="p:"+k2,j2=JSON.stringify(S.p[k2]);
    if(snap[id2]!==j2){Progress.touch(id2,{d:S.p[k2]});snap[id2]=j2;}
  }
  var dj=JSON.stringify(S.daily);
  if(snap["daily"]!==dj){Progress.touch("daily",{d:S.daily});snap["daily"]=dj;}
  var sj=JSON.stringify(S.set);
  if(snap["set"]!==sj){Progress.touch("set",{d:S.set});snap["set"]=sj;}
  var xj=JSON.stringify(S.x);
  if(snap["x"]!==xj){Progress.touch("x",{d:S.x});snap["x"]=xj;}
}
function loadS(){
  localLoad();migAll();snapshot();
  if(!window.Progress||!window.APP)return Promise.resolve();
  var remembered=false;
  try{remembered=!!localStorage.getItem("dt:s");}catch(e){}
  if(!remembered)return Promise.resolve();
  Progress.init(Object.assign({},window.APP,{path:"english.json",delay:8000}));
  syncOn=true;
  return Progress.start(false).then(function(st){
    var empty=true;
    for(var id in st){
      empty=false;
      var v=st[id]&&st[id].d;
      if(!v)continue;
      if(id.slice(0,2)==="w:")S.w[id.slice(2)]=v;
      else if(id.slice(0,2)==="p:")S.p[id.slice(2)]=v;
      else if(id==="daily")S.daily=v;
      else if(id==="set")S.set=Object.assign(S.set,v);
      else if(id==="x")S.x=v;
    }
    migAll();
    if(empty){snap={};syncPush();}   /* первая синхронизация — выгружаем накопленное */
    else{snapshot();localSave();}
  }).catch(function(){});
}

var synth=("speechSynthesis" in window)?window.speechSynthesis:null;
var voices=[];
function loadVoices(){
  if(!synth)return;
  voices=synth.getVoices().filter(function(v){return /^en/i.test(v.lang);});
  /* американские голоса первыми, внутри — локальные (работают офлайн) после сетевых */
  voices.sort(function(a,b){
    var ua=/en[-_]US/i.test(a.lang)?0:1,ub=/en[-_]US/i.test(b.lang)?0:1;
    return ua-ub;
  });
  var sel=$("#voiceSel");if(sel)fillVoiceSel(sel);
  if(view==="review")render();
}
var speechBroken=false,probeDone=false;
if(synth){
  loadVoices();
  if(typeof synth.onvoiceschanged!=="undefined")synth.onvoiceschanged=loadVoices;
  /* Android наполняет список с задержкой, иногда лишь после касания экрана */
  [300,1200,3000].forEach(function(ms){setTimeout(function(){if(!voices.length)loadVoices();},ms);});
  document.addEventListener("touchstart",function once(){
    document.removeEventListener("touchstart",once);
    if(!voices.length)loadVoices();
  },{passive:true});
}
function speak(txt,rate){
  if(!synth)return;
  try{
    synth.cancel();
    var u=new SpeechSynthesisUtterance(txt);
    u.lang="en-US";
    var v=null;
    for(var i=0;i<voices.length;i++){if(voices[i].voiceURI===S.set.voice){v=voices[i];break;}}
    if(!v&&voices.length)v=voices[0];
    if(v)u.voice=v;
    u.rate=rate||S.set.rate;
    var started=false;
    u.onstart=function(){started=true;probeDone=true;speechBroken=false;};
    u.onerror=function(){if(!probeDone){probeDone=true;speechBroken=true;}};
    /* движок проверяем однократно и молча: перерисовка отсюда даёт петлю с автоозвучкой */
    if(!probeDone)setTimeout(function(){if(!started&&!probeDone){probeDone=true;speechBroken=true;}},2500);
    if(synth.speaking||synth.pending)setTimeout(function(){synth.speak(u);},80);
    else synth.speak(u);
  }catch(e){speechBroken=true;}
}

  for(var i=0;i<14;i++){
    var v=S.daily[dkey(d)]||{a:0,c:0};
    r.push({a:v.a,c:v.c,lbl:d.getDate()});
    d.setDate(d.getDate()+1);
  }

/* ================= SRS ================= */
/* Треки: 0 — чтение, 1 — аудирование, 2 — письмо.
   Чтение и письмо опираются на один и тот же образ слова, поэтому промах
   в одном откатывает оба. Аудирование — отдельный навык, отвечает само за себя. */
function linkedTracks(tr){ return tr===1 ? [1] : [0,2]; }

/* Откат на две коробки, но не ниже второй и никогда вверх.
   Срок при этом короткий: промах нужно переспросить в этой же сессии. */
function demote(x,tr,now){
  x.b[tr]=Math.min(x.b[tr],Math.max(2,x.b[tr]-2));
  x.d[tr]=now+IV[1];
}

function applyAns(i,ti,ok,mode){
  var x=ws(i),now=Date.now(),tr=ti>>1;
  var wasNew=(x.b[0]+x.b[1]+x.b[2]===0);
  x.a[ti]++;if(ok)x.c[ti]++;
  dlog(ok);

  /* В тренировке коробки не двигаются ни вверх, ни вниз — только статистика. */
  if(mode==="train"){save();return;}

  if(ok){
    if(x.b[tr]===0){x.b[tr]=1;x.d[tr]=now+IV[1];}
    else if(mode==="review"||now>=x.d[tr]){x.b[tr]=Math.min(6,x.b[tr]+1);x.d[tr]=now+IV[x.b[tr]];}
    x.str++;
  }else{
    x.lap++;x.str=0;
    var L=linkedTracks(tr);
    for(var k=0;k<L.length;k++){
      if(L[k]===2&&noWrite(i))continue;
      if(x.b[L[k]]>0)demote(x,L[k],now);
    }
    if(x.b[tr]===0){x.b[tr]=1;x.d[tr]=now+IV[1];}
  }
  if(wasNew&&x.b[0]+x.b[1]+x.b[2]>0)dnew();
  save();
}
/* Слово с несколькими просроченными треками даёт несколько записей в очереди.
   Простая перетасовка их слипает: в 75% сессий одно и то же слово шло подряд.
   Раздаём по кругам — внутри круга каждое слово ровно один раз. */
function spreadPairs(d){
  var by={},ids=[],k;
  for(k=0;k<d.length;k++){
    var id=d[k].i;
    if(!by[id]){by[id]=[];ids.push(id);}
    by[id].push(d[k]);
  }
  for(k=0;k<ids.length;k++)shuffle(by[ids[k]]);
  var out=[];
  while(out.length<d.length){
    var round=ids.filter(function(x){return by[x].length;});
    if(!round.length)break;
    shuffle(round);
    /* не начинать круг тем словом, которым закончился предыдущий */
    if(out.length&&round.length>1&&round[0]===out[out.length-1].i){
      var t=round[0];round[0]=round[1];round[1]=t;
    }
    for(k=0;k<round.length;k++)out.push(by[round[k]].shift());
  }
  return out;
}
function duePairs(){
  var now=Date.now(),r=[];
  for(var i=0;i<W.length;i++){
    var x=wg(i);if(!x)continue;
    for(var t=0;t<3;t++){
      if(t===2&&noWrite(i))continue;
      if(x.b[t]>=1&&x.d[t]<=now)r.push({i:i,t:t});
    }
  }
  return r;
}
function newIn(cat){
  var r=[];
  for(var i=0;i<W.length;i++){
    if(cat!=="all"&&W[i][4]!==cat)continue;
    var x=wg(i);if(!x||(x.b[0]+x.b[1]+x.b[2]===0&&!x.kn))r.push(i);
  }
  /* новые — строго по частотности, уровень не учитывается */
  r.sort(function(p,q){return RK[p]-RK[q];});
  return r;
}
var TT=[["mcDeRu","mcRuDe"],["mcAuRu","mcAuDe"],["wrRuDe","wrAu"]];
function typeForTrack(t,b){
  var pro=b>2;
  if(Math.random()<0.25)pro=!pro;
  return TT[t][pro?1:0];
}
/* ================= ВОПРОСЫ ================= */
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function distract(i,n){
  var w=W[i],pool=[],j;
  for(j=0;j<W.length;j++){if(j!==i&&W[j][4]===w[4]&&W[j][3]!==w[3]&&(!w[6]||W[j][6]!==w[6]))pool.push(j);}
  shuffle(pool);
  if(pool.length<n){
    var extra=[];
    for(j=0;j<W.length;j++){if(j!==i&&W[j][3]!==w[3]&&(!w[6]||W[j][6]!==w[6])&&pool.indexOf(j)<0)extra.push(j);}
    shuffle(extra);
    while(pool.length<n&&extra.length)pool.push(extra.pop());
  }
  return pool.slice(0,n);
}
function makeQ(i,type){
  var q={wid:i,type:type};
  if(type.indexOf("mc")===0){
    var opts=distract(i,3).map(function(j){return {wid:j};});
    opts.push({wid:i});
    shuffle(opts);
    q.opts=opts;
  }
  return q;
}
function norm(s){
  return String(s).toLowerCase().trim()
    .replace(/[’‘`´]/g,"'")
    .replace(/[.,!?«»"]/g,"")
    .replace(/é/g,"e")
    .replace(/-/g," ")
    .replace(/\s+/g," ").trim();
}
/* Принимаем: точное написание; британский вариант (colour) — с пометкой;
   «to» перед глаголом и артикль перед существительным — ошибкой не считаем. */
function checkWrite(i,inp,type){
  var w=W[i],v=norm(inp||"");
  if(!v)return {ok:false};
  var base=norm(w[1]);
  var strip=v.replace(/^(to|a|an|the) /,"");
  if(v===base||strip===base)return {ok:true};
  var alts=w[8]?w[8].split("|"):[];
  for(var k=0;k<alts.length;k++){
    var a=norm(alts[k]);
    if(v===a||strip===a)return {ok:true,alt:alts[k]};
  }
  /* слитно/раздельно: icecream ≈ ice cream */
  if(v.replace(/ /g,"")===base.replace(/ /g,""))return {ok:true,space:true};
  /* другое слово из словаря: синоним по переводу или омофон в диктанте */
  var ruI=ruParts(W[i][3]);
  for(var j=0;j<W.length;j++){
    if(j===i)continue;
    var nj=norm(W[j][1]);
    if(nj!==v&&nj!==strip)continue;
    if(type==="wrAu"&&W[j][6]&&W[j][6]===W[i][6])return {ok:true,homo:W[j][1]};
    var ruJ=ruParts(W[j][3]);
    for(var k=0;k<ruJ.length;k++)if(ruI.indexOf(ruJ[k])>=0)return {ok:false,syn:W[j][1]};
  }
  return {ok:false};
}
function ruParts(s){
  return String(s).toLowerCase().replace(/\([^)]*\)/g,"").split(/[;,]/)
    .map(function(x){return x.trim();}).filter(Boolean);
}
/* ================= СЕССИЯ ================= */
function startSession(qs,mode,title,back){
  if(!qs.length){toast("Нет подходящих слов");return;}
  sess={qs:qs,mode:mode,title:title,back:back||"review",i:0,c:0,mist:[],ans:false,chosen:-1,fb:null,userText:""};
  show("session");
}
function curQ(){return sess.qs[sess.i];}
function answerChoice(k){
  if(!sess||sess.ans||sess.i>=sess.qs.length)return;
  var q=curQ();
  if(!q.opts||k>=q.opts.length)return;
  sess.chosen=k;
  finishAns(q.opts[k].wid===q.wid,"");
}
function submitWrite(){
  if(!sess||sess.ans)return;
  var inp=$("#wInp");if(!inp)return;
  var val=inp.value;
  if(!val.trim())return;
  var r=checkWrite(curQ().wid,val,curQ().type);
  if(!r.ok&&r.syn){toast("«"+r.syn+"» тоже так переводится, но загадано другое слово. Попробуй ещё.");inp.select();return;}
  sess.userText=val;
  var msg="";
  if(r.ok&&r.alt)msg="Засчитано: «"+r.alt+"» — британский вариант; по-американски — "+W[curQ().wid][1]+".";
  if(r.ok&&r.space)msg="Засчитано; правильно пишется: "+W[curQ().wid][1]+".";
  if(r.ok&&r.homo)msg="Засчитано: «"+r.homo+"» звучит так же. Здесь загадано «"+W[curQ().wid][1]+"» — "+W[curQ().wid][3]+".";
  inp.blur();   /* разбор виден, следующий Enter листает осознанно */
  finishAns(r.ok,msg);
}
function finishAns(ok,msg){
  var q=curQ(),ti=TYPES.indexOf(q.type);
  var x=ws(q.wid);
  /* снимок до применения: позволяет пересчитать ответ как верный (опечатка) */
  sess.undo={wid:q.wid,ti:ti,snap:JSON.stringify(x),wasOk:ok};
  sess.ans=true;sess.fb={ok:ok,msg:msg};
  applyAns(q.wid,ti,ok,ansMode(q));
  if(q.kc){knownCheck(q.wid,ok);if(!ok)sess.fb.msg="Слово было отмечено как известное — возвращаю его в изучение.";}
  if(ok)sess.c++;else sess.mist.push(q.wid);
  /* в повторении ошибка возвращается в этой же сессии, не более двух раз */
  if(!ok&&sess.mode==="review"&&(q.rt||0)<2){
    var rq=makeQ(q.wid,q.type);rq.prac=true;rq.rt=(q.rt||0)+1;
    var at=Math.min(sess.i+1+3+Math.floor(Math.random()*3),sess.qs.length);
    sess.qs.splice(at,0,rq);
    sess.undo.retry=rq;
  }
  render();
  if(S.set.auto)autoSpeak(q.wid,200);
}

/* «Это опечатка»: откатываем последствия промаха и засчитываем как верный. */
function acceptTypo(){
  var u=sess&&sess.undo;
  if(!u||u.wasOk)return;
  var q0=curQ(),isMc=q0.type.indexOf("mc")===0;
  var x=ws(u.wid),snap=JSON.parse(u.snap),k;
  for(k in snap)x[k]=snap[k];          /* состояние слова до ответа */
  var d=drec();d.a--;                   /* и дневная статистика */
  var ix=sess.mist.lastIndexOf(u.wid);
  if(ix>=0)sess.mist.splice(ix,1);
  if(u.retry){var ri=sess.qs.indexOf(u.retry);if(ri>sess.i)sess.qs.splice(ri,1);u.retry=null;}
  applyAns(u.wid,u.ti,true,ansMode(q0));
  sess.c++;
  sess.undo.wasOk=true;
  if(isMc){
    /* подсветка переезжает на верный вариант — красного больше нет */
    for(var o=0;o<q0.opts.length;o++)if(q0.opts[o].wid===q0.wid){sess.chosen=o;break;}
  }
  sess.fb={ok:true,msg:isMc?"Засчитано: промахнулся пальцем.":"Засчитано как опечатка."};
  render();
}
function nextQ(){
  if(!sess)return;
  sess.ans=false;sess.chosen=-1;sess.fb=null;sess.userText="";sess.undo=null;
  sess.i++;
  render();
}
/* Вес карточки (слово × трек) при отборе в повторение.
   Растёт с ошибками именно в этом треке и падает с номером коробки:
   крепкая карточка ≈0.4, слабая — 5–10. Ошибки сглажены, чтобы одна
   случайная ошибка у новой карточки не перевешивала всё. */
var REV_LEN=24, WEAK_W=3;
function cardW(i,t){
  var x=wg(i);if(!x)return 1;
  var a=x.a[2*t]+x.a[2*t+1],c=x.c[2*t]+x.c[2*t+1];
  var err=(a-c+0.5)/(a+2);
  var bw=[6,6,4,2.5,1.6,1,0.7][x.b[t]]||1;
  return bw*(0.2+3*err)*(1+Math.min(x.lap||0,10)*0.08);
}
/* взвешенный отбор без повторов: ключ u^(1/w), берём n наибольших */
function pickWeighted(arr,n){
  return arr.map(function(p){return {p:p,k:Math.pow(Math.random(),1/Math.max(cardW(p.i,p.t),1e-3))};})
    .sort(function(a,b){return b.k-a.k;}).slice(0,n).map(function(z){return z.p;});
}
function buildReview(){
  var due=duePairs(),take=pickWeighted(due,REV_LEN);
  /* Очередь короткая — добираем слабыми карточками, у которых срок ещё не настал.
     Они идут как закрепление: на коробки и сроки не влияют. */
  var extra=Math.min(REV_LEN-take.length,Math.max(3,Math.ceil(take.length/2)));
  if(take.length&&extra>0){
    var now=Date.now(),inQ={},cand=[];
    take.forEach(function(p){inQ[p.i]=1;});
    for(var i=0;i<W.length;i++){
      if(inQ[i])continue;
      var x=wg(i);if(!x)continue;
      for(var t=0;t<3;t++){
        if(t===2&&noWrite(i))continue;
        if(x.b[t]>=1&&x.d[t]>now&&cardW(i,t)>=WEAK_W)cand.push({i:i,t:t,prac:true});
      }
    }
    var seen={};
    pickWeighted(cand,cand.length).forEach(function(p){
      if(extra>0&&!seen[p.i]){seen[p.i]=1;take.push(p);extra--;}
    });
  }
  /* выборочная проверка слов, отмеченных «знаю» */
  if(take.length){
    var kq=[],kn=Date.now();
    for(var ki=0;ki<W.length;ki++){var kx=wg(ki);if(kx&&kx.kn&&kn-(kx.kc||0)>KN_GAP)kq.push(ki);}
    shuffle(kq);
    for(var kk=0;kk<Math.min(KN_N,kq.length);kk++)take.push({i:kq[kk],t:Math.floor(Math.random()*3),prac:true,kc:true});
  }
  return spreadPairs(take).map(function(p){
    var q=makeQ(p.i,typeForTrack(p.t,wg(p.i).b[p.t]));
    if(p.prac)q.prac=true;
    if(p.kc)q.kc=true;
    return q;
  });
}
function startReview(){
  startSession(buildReview(),"review","Повторение","review");
}
/* режим записи ответа для конкретной карточки: закрепление и повтор ошибки
   не двигают коробки, даже внутри сессии повторения */
function ansMode(q){ return (sess.mode==="review"&&!q.prac)?"review":"train"; }
function introduce(i){
  var x=ws(i),now=Date.now(),ch=false;
  for(var t=0;t<3;t++)if(x.b[t]===0){x.b[t]=1;x.d[t]=now+IV[1];ch=true;}
  if(ch){dnew();save();}
}
function startLearn(cat,n){
  var list=newIn(cat).slice(0,n);
  if(!list.length){toast("Новых слов здесь больше нет");return;}
  learn={list:list,i:0,cat:cat,known:0};
  show("learn");
}
var KN_N=2,KN_GAP=14*86400000;
function markKnown(i,on){
  var x=ws(i);
  if(on){x.kn=1;x.b=[0,0,0];x.d=[0,0,0];x.kc=Date.now();}
  else{delete x.kn;delete x.kc;}
  save();
}
function knownCount(){var n=0;for(var i=0;i<W.length;i++){var x=wg(i);if(x&&x.kn)n++;}return n;}
function knownCheck(i,ok){
  var x=ws(i),now=Date.now();
  if(ok){x.kc=now;}
  else{delete x.kn;delete x.kc;for(var t=0;t<3;t++){x.b[t]=1;x.d[t]=now+IV[1];}}
  save();
}
/* «Знаю» на карточке нового слова: вместо него подставляется следующее новое из той же
   категории, так что «Учить 7» по-прежнему даёт семь действительно новых слов. */
function learnKnow(){
  if(!learn)return;
  var i=learn.list[learn.i],rp=null;
  markKnown(i,true);
  learn.known=(learn.known||0)+1;
  if(learn.cat!==undefined){
    var nx=newIn(learn.cat);
    for(var k=0;k<nx.length;k++)if(learn.list.indexOf(nx[k])<0){rp=nx[k];break;}
  }
  if(rp!==null){learn.list[learn.i]=rp;render();return;}
  learn.list.splice(learn.i,1);
  if(!learn.list.length){learn=null;toast("Новых слов здесь больше нет");show("review");return;}
  if(learn.i>=learn.list.length)learnFinish();else render();
}
function learnNext(){
  introduce(learn.list[learn.i]);
  learn.i++;
  if(learn.i>=learn.list.length)learnFinish();else render();
}
function learnFinish(){
  {
    var ids=learn.list.slice();
    var p1=shuffle(ids.slice()),p2=shuffle(ids.slice());
    /* второй проход не должен начинаться словом, которым кончился первый */
    if(p2.length>1&&p2[0]===p1[p1.length-1]){var t2=p2[0];p2[0]=p2[1];p2[1]=t2;}
    var qs=p1.map(function(i){return makeQ(i,"mcDeRu");})
      .concat(p2.map(function(i){return makeQ(i,"mcRuDe");}));
    learn=null;
    startSession(qs,"train","Закрепление новых слов","review");
  }
}
function prio(i,ti){
  var x=wg(i);
  if(!x||x.a[ti]===0)return 0.9+Math.random()*0.4;
  var er=(x.a[ti]-x.c[ti])/x.a[ti];
  return er*2+Math.random()*0.5;
}
function startTrain(){
  var pool=[],i,PK=pickMap();
  for(i=0;i<W.length;i++){
    if(trainCfg.picked){ if(!PK[kid(i)])continue; }
    else if(!trainCfg.cats.has(W[i][4]))continue;
    var x=wg(i);
    if(trainCfg.learned&&(!x||(x.b[0]+x.b[1]+x.b[2]===0&&!x.kn)))continue;
    if(noWrite(i)&&(trainCfg.type==="wrRuDe"||trainCfg.type==="wrAu"))continue;
    pool.push(i);
  }
  if(!pool.length){toast(trainCfg.picked
      ?"Среди отмеченных нет слов для этого режима — сними «только изученные» или отметь другие"
      :"Сначала изучи слова в выбранных категориях");return;}
  var ti=TYPES.indexOf(trainCfg.type);
  pool.sort(function(a,b){return prio(b,ti)-prio(a,ti);});
  var take=shuffle(pool.slice(0,trainCfg.len));
  startSession(take.map(function(i){return makeQ(i,trainCfg.type);}),"train",TNAME[trainCfg.type],"train");
}
/* ================= ЭКРАНЫ ================= */
function catStats(c){
  var tot=0,st=0,ms=0;
  for(var i=0;i<W.length;i++){
    if(W[i][4]!==c)continue;tot++;
    var x=wg(i);
    if(x&&(x.kn||x.b[0]+x.b[1]+x.b[2]>0))st++;
    if(x&&x.kn||isDone(i,x))ms++;
  }
  return {tot:tot,st:st,ms:ms};
}
function vReview(){
  var dp=duePairs(),uw={},un=0;
  for(var j=0;j<dp.length;j++)if(!uw[dp[j].i]){uw[dp[j].i]=1;un++;}
  var due=dp.length;
  var t=S.daily[today()]||{a:0,c:0,n:0};
  var st=calcStreak();
  var learned=0;
  for(var i=0;i<W.length;i++){var x=wg(i);if(x&&x.b[0]+x.b[1]+x.b[2]>0)learned++;}
  var h='<section class="hero"><div class="eyebrow">Интервальные повторения</div>';
  h+='<div class="heroN">'+due+'</div><div class="heroSub">'+plural(due,"карточка ждёт","карточки ждут","карточек ждут")+(due?' · '+un+' '+plural(un,"слово","слова","слов"):"")+'</div>';
  h+='<button class="btn acc big" data-act="startReview"'+(due?"":" disabled")+'>'+(due?"Начать повторение":"Всё повторено ✓")+'</button>';
  h+='<div class="mut xs" style="margin-top:9px">карточка = слово × навык (чтение · слух · письмо) · слабые карточки выпадают чаще, ошибка возвращается в той же сессии</div></section>';
  h+='<section class="card"><div class="cardT">Новые слова</div><div class="row">';
  h+='<select id="newCat" class="sel grow"><option value="all">Все категории</option>';
  for(var c in CATS)h+='<option value="'+c+'">'+CATS[c][0]+' '+CATS[c][1]+'</option>';
  h+='</select><select id="newN" class="sel"><option>5</option><option selected>7</option><option>10</option><option>15</option></select>';
  h+='<button class="btn" data-act="learnGo">Учить</button></div>';
  var kc0=knownCount();
  h+='<div class="mut sm">В работе: '+learned+' из '+W.length+' слов'+(kc0?' · известны: '+kc0:'')+'</div></section>';
  h+='<section class="card"><div class="cardT">Сегодня</div><div class="trio">';

/* ================= НЕПРАВИЛЬНЫЕ ГЛАГОЛЫ =================
   IRV: [инфинитив, past, past participle, перевод, примечание, уровень, IPA×3, частота].
   Варианты формы через «/»: первый — американская норма, остальные тоже засчитываются.
   Коробки те же, что у слов: 10 мин → 1 → 3 → 7 → 16 → 35 дней.
   Режим вопроса зависит от коробки: сначала узнавание (выбор), потом письмо
   обеих форм, потом форма в живой фразе из Tatoeba. */
function xs(){
  if(!S.x)S.x={iv:{},pv:{}};
  if(!S.x.iv)S.x.iv={};
  if(!S.x.pv)S.x.pv={};
  return S.x;
}
function ivg(k){return xs().iv[k]||null;}
function ivs(k){var m=xs().iv;return m[k]||(m[k]={b:0,d:0,a:0,c:0,lap:0});}
function ivMain(s){return s.split("/")[0];}
function ivForms(v){return [v[0],ivMain(v[1]),ivMain(v[2])];}
var IVGN={"A-A-A":"все три формы одинаковы","A-B-B":"вторая и третья совпадают","A-B-A":"третья = инфинитив","A-B-C":"все три разные"};
function ivGroup(v){
  var f=ivForms(v);
  if(f[0]===f[1]&&f[1]===f[2])return "A-A-A";
  if(f[1]===f[2])return "A-B-B";
  if(f[0]===f[2])return "A-B-A";
  return "A-B-C";
}
function ivFormsTxt(v){return v[0]+" — "+v[1].replace(/\//g," / ")+" — "+v[2].replace(/\//g," / ");}
function ivNorm(s){return String(s||"").toLowerCase().replace(/[’`]/g,"'").replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();}
function ivOk(given,form){
  var g=ivNorm(given),alts=form.split("/");
  for(var k=0;k<alts.length;k++)if(g===ivNorm(alts[k]))return true;
  /* was/were: принимаем одну из форм */
  return false;
}
function ivDue(){
  var now=Date.now(),r=[];
  for(var i=0;i<IRV.length;i++){var x=ivg(IRV[i][0]);if(x&&x.b>0&&x.d<=now)r.push(i);}

function ivNew(){
  var r=[];

function ivRegular(b){

var ivess=null;
function ivType(i){
  var x=ivg(IRV[i][0]),b=x?x.b:0;

  if(b<=1)return "mc";

  if(b>=3&&hasEx&&Math.random()<0.4)return "sent";
  return "wr";

function ivMakeQ(i,type){
  var v=IRV[i],q={i:i,type:type};
  if(type==="mc"){
    q.which=Math.random()<0.5?1:2;
    var right=ivMain(v[q.which]),pool=[right];
    var cand=[ivMain(v[3-q.which]),ivRegular(v[0]),v[0]];
    /* формы соседних глаголов той же группы — самые коварные отвлекатели */

    for(var j=0;j<IRV.length;j++)if(j!==i&&ivGroup(IRV[j])===g)same.push(ivMain(IRV[j][q.which]));

    for(var k=0;k<cand.length&&pool.length<4;k++){
      var c=cand[k];
      if(pool.indexOf(c)<0&&!ivOk(c,v[q.which]))pool.push(c);
    }
    q.opts=shuffle(pool);q.ans=right;

/* ================= ФРАЗОВЫЕ ГЛАГОЛЫ =================
   PHV: [глагол, частица, перевод, уровень, [[фраза, перевод, позиция частицы, длина]]].
   Три навыка вперемешку по коробке: значение (узнать), частица (вставить в живую
   фразу), обратный перевод (вспомнить глагол по смыслу). */
function pvKey(p){return p[0]+" "+p[1];}
function pvg(k){return xs().pv[k]||null;}
function pvs(k){var m=xs().pv;return m[k]||(m[k]={b:0,d:0,a:0,c:0,lap:0});}
function pvDue(){
  var now=Date.now(),r=[];
  for(var i=0;i<PHV.length;i++){var x=pvg(pvKey(PHV[i]));if(x&&x.b>0&&x.d<=now)r.push(i);}
  return r;
}
function pvNew(){
  var r=[];
  for(var i=0;i<PHV.length;i++){var x=pvg(pvKey(PHV[i]));if(!x||x.b===0)r.push(i);}
  r.sort(function(a,b){return PHV[a][3]-PHV[b][3]||a-b;});
  return r;
}
var PARTS=["up","down","in","out","on","off","away","back","over","after","for","at","into","about","with","to","by","around","through","across"];
function pvOpts(right,pool,n){
  var o=[right],g=0;
  while(o.length<n&&g++<300){var c=pool[Math.floor(Math.random()*pool.length)];if(o.indexOf(c)<0)o.push(c);}
  return shuffle(o);
}
function pvMakeQ(i,type){
  var p=PHV[i],q={i:i,type:type};
  if(type==="gap"&&!(p[4]&&p[4].length))type=q.type="mean";
  if(type==="gap"){
    q.ex=p[4][Math.floor(Math.random()*p[4].length)];
    var nw=p[1].split(" ").length,pool=[];
    for(var j=0;j<PHV.length;j++)if(PHV[j][1].split(" ").length===nw&&PHV[j][1]!==p[1])pool.push(PHV[j][1]);
    if(nw===1)pool=pool.concat(PARTS);
    q.opts=pvOpts(p[1],pool,4);q.ans=p[1];
  }else if(type==="mean"){
    var pool2=[];for(var k=0;k<PHV.length;k++)if(k!==i)pool2.push(PHV[k][2]);
    /* сначала значения того же глагола — их и путают */
    var same=[];for(var k2=0;k2<PHV.length;k2++)if(k2!==i&&PHV[k2][0]===p[0])same.push(PHV[k2][2]);
    var o=[p[2]];shuffle(same);
    for(var s1=0;s1<same.length&&o.length<3;s1++)if(o.indexOf(same[s1])<0)o.push(same[s1]);
    while(o.length<4){var c=pool2[Math.floor(Math.random()*pool2.length)];if(o.indexOf(c)<0)o.push(c);}
    q.opts=shuffle(o);q.ans=p[2];
  }else{
    var o2=[pvKey(p)],same2=[],other=[];
    for(var m=0;m<PHV.length;m++){if(m===i)continue;(PHV[m][0]===p[0]||PHV[m][1]===p[1]?same2:other).push(pvKey(PHV[m]));}
    shuffle(same2);shuffle(other);
    var cand=same2.concat(other);
    for(var c2=0;c2<cand.length&&o2.length<4;c2++)if(o2.indexOf(cand[c2])<0)o2.push(cand[c2]);
    q.opts=shuffle(o2);q.ans=pvKey(p);
  }
  return q;
}
function pvType(i){
  var x=pvg(pvKey(PHV[i])),b=x?x.b:0,r=Math.random();
  if(b<=1)return r<0.6?"mean":"gap";
  if(b<=3)return r<0.6?"gap":"rev";
  return r<0.5?"gap":"rev";
}
var pvess=null;
function pvStart(mode,n){
  var list;
  if(mode==="due"){list=shuffle(pvDue()).slice(0,n||15);if(!list.length){toast("Сейчас повторять нечего");return;}}
  else if(mode==="new"){
    list=pvNew().slice(0,n||5);if(!list.length){toast("Новых фразовых глаголов не осталось");return;}
    pvess={list:list,i:0,c:0,q:null,fb:null,intro:true,mist:[]};show("phs");return;
  }else{
    var all=[];for(var i=0;i<PHV.length;i++){var x=pvg(pvKey(PHV[i]));if(x&&x.b>0)all.push(i);}
    if(!all.length){toast("Сначала выучи несколько глаголов");return;}
    all.sort(function(a,b){return pvWeak(b)-pvWeak(a);});
    list=shuffle(all.slice(0,n||15));
  }
  pvess={list:list,i:0,c:0,q:pvMakeQ(list[0],pvType(list[0])),fb:null,mode:mode,mist:[]};
  show("phs");
}
function pvWeak(i){var x=pvg(pvKey(PHV[i]));if(!x||!x.a)return 0.5+Math.random()*0.3;return (x.a-x.c)/x.a*2+Math.random()*0.4+(6-x.b)*0.05;}
function pvIntroNext(){
  var s=pvess;s.i++;
  if(s.i>=s.list.length){
    var L=s.list.slice();
    for(var k=0;k<L.length;k++){var x=pvs(pvKey(PHV[L[k]]));if(x.b===0){x.b=1;x.d=Date.now()+IV[1];}}
    dnew();save();
    pvess={list:shuffle(L.slice()),i:0,c:0,q:null,fb:null,mode:"learn",mist:[]};
    pvess.q=pvMakeQ(pvess.list[0],"mean");
  }
  render();
}
function pvApply(i,ok){
  var x=pvs(pvKey(PHV[i])),now=Date.now();
  x.a++;if(ok)x.c++;
  dlog(ok);
  if(pvess.mode==="learn"||pvess.mode==="mix"){save();return;}
  if(ok){
    if(x.b===0){x.b=1;x.d=now+IV[1];}
    else if(now>=x.d){x.b=Math.min(6,x.b+1);x.d=now+IV[x.b];}
  }else{x.lap++;x.b=Math.max(1,x.b-2);x.d=now+IV[1];}
  save();
}
function pvAnswer(choice){
  var s=pvess;if(!s||s.fb)return;
  var q=s.q,ok=(choice===q.ans);
  s.undo=ok?null:JSON.stringify(pvs(pvKey(PHV[q.i])));
  s.fb={ok:ok,given:choice};
  if(ok)s.c++;else s.mist.push(q.i);
  pvApply(q.i,ok);
  render();
  if(S.set.auto)speak(q.type==="gap"?q.ex[0]:pvKey(PHV[q.i]));
}
function pvMis(){
  var s=pvess;if(!s||!s.fb||s.fb.ok||!s.undo)return;
  var x=pvs(pvKey(PHV[s.q.i])),snap=JSON.parse(s.undo);
  for(var k in snap)x[k]=snap[k];
  var d=drec();d.a--;
  var ix=s.mist.lastIndexOf(s.q.i);if(ix>=0)s.mist.splice(ix,1);
  pvApply(s.q.i,true);s.c++;
  s.fb={ok:true,given:s.q.ans,mis:true};s.undo=null;render();
}
function pvNext(){
  var s=pvess;if(!s)return;
  s.i++;s.fb=null;s.undo=null;
  if(s.i<s.list.length)s.q=pvMakeQ(s.list[s.i],s.mode==="learn"?"mean":pvType(s.list[s.i]));
  render();
}
function pvExHtml(ex,hl){
  var w=ex[0].split(" "),out=[];
  for(var k=0;k<w.length;k++){
    var inGap=k>=ex[2]&&k<ex[2]+ex[3];
    if(!inGap){out.push(esc(w[k]));continue;}
    var tail=w[k].match(/[.,!?;:]+$/),tl=tail?tail[0]:"",core=w[k].slice(0,w[k].length-tl.length);
    if(hl)out.push('<b class="szhl">'+esc(core)+'</b>'+esc(tl));
    else out.push((k===ex[2]?'<span class="szgap">    </span>':'')+esc(tl));
  }
  return out.join(" ").replace(/\s+/g," ");
}

    if(P[i].s.length&&(!x||x.b[tr]===0))r.push(i);
  }
  r.sort(function(a,b){return P[a].lv-P[b].lv;});   /* сначала A1, потом A2, потом B1 */
  return r;
}
/* ---- выборка фразы: не повторяем недавние ---- */
function szSample(pi){
  var p=szPats()[pi],x=sps(p.id),fresh=[];
  for(var i=0;i<p.s.length;i++)if(x.seen.indexOf(p.s[i][0])<0)fresh.push(p.s[i]);
  var pick=(fresh.length?fresh:p.s)[Math.floor(Math.random()*(fresh.length?fresh.length:p.s.length))];
  x.seen.push(pick[0]);
  while(x.seen.length>Math.min(12,Math.ceil(p.s.length/2)))x.seen.shift();
  var t=szText(pick[0]);
  return {de:t[0],ru:t[1],slot:pick[1],pat:pi};
}
function szApply(pi,tr,ok){
  var p=szPats()[pi],x=sps(p.id),now=Date.now();
  x.a[tr]++;if(ok)x.c[tr]++;
  dlog(ok);
  if(ok){
    x.st[tr]++;
    if(x.b[tr]===0)x.b[tr]=1;
    if(x.st[tr]>=SZ_RUN){                 /* три верных подряд — следующая ступень */
      x.st[tr]=0;
      x.b[tr]=Math.min(SZ_MAXB,x.b[tr]+1);
      x.d[tr]=now+SIV[x.b[tr]];
    }else{
      x.d[tr]=now+SIV[1];                 /* серия набирается близко по времени */
    }
  }else{
    x.lap++;x.st[tr]=0;
    /* минус две ступени: одна опечатка не должна стоить месяца работы */
    x.b[tr]=Math.max(1,x.b[tr]-2);
    x.d[tr]=now+SIV[1];
  }
  save();
}
/* сколько верных подряд набрано на текущей ступени */
function szRun(pi,tr){var x=spg(szPats()[pi].id);return x&&x.st?x.st[tr]:0;}
function szBox(pi,tr){var x=spg(szPats()[pi].id);return x?x.b[tr]:0;}
/* ---- разбор фразы ---- */
function szWords(s){return s.replace(/[.,!?;:]/g," ").split(/\s+/).filter(Boolean);}
function szGapWord(c){var w=szWords(c.de);return w[c.slot]||"";}
function szGapHtml(c){
  var w=szWords(c.de),out=[];
  for(var i=0;i<w.length;i++)
    out.push(i===c.slot?'<span class="szgap">    </span>':esc(w[i]));
  return out.join(" ");
}
function szNorm(s){return String(s).replace(/[.,!?;:]/g,"").replace(/\s+/g," ").trim();}
function szDiff(user,corr){
  var a=szNorm(user).split(" ").filter(Boolean),b=szNorm(corr).split(" ").filter(Boolean);
  var n=a.length,m=b.length,L=[],i,k;
  for(i=0;i<=n;i++){L.push([]);for(k=0;k<=m;k++)L[i][k]=0;}
  for(i=n-1;i>=0;i--)for(k=m-1;k>=0;k--)
    L[i][k]=(a[i]===b[k])?L[i+1][k+1]+1:Math.max(L[i+1][k],L[i][k+1]);
  var out=[];i=0;k=0;
  while(i<n&&k<m){
    if(a[i]===b[k]){out.push({t:"ok",w:b[k]});i++;k++;}
    else if(L[i+1][k]>=L[i][k+1]){out.push({t:"extra",w:a[i]});i++;}
    else{out.push({t:"miss",w:b[k]});k++;}
  }
  for(;i<n;i++)out.push({t:"extra",w:a[i]});
  for(;k<m;k++)out.push({t:"miss",w:b[k]});
  return out;
}
function szDiffHtml(d){
  if(!d)return"";
  var h='<div class="szdiff">';
  for(var i=0;i<d.length;i++)h+='<span class="d-'+d[i].t+'">'+esc(d[i].w)+'</span> ';
  return h+'</div><div class="mut sm">зачёркнуто — лишнее, подчёркнуто — пропущено</div>';

  ins:function(b){insCh(b.dataset.ch);},
  lKnow:function(){learnKnow();},
  unknow:function(b){markKnown(+b.dataset.i,false);render();},
  knowPick:function(){
    var P=pickedIdx().filter(function(i){return wStatus(i)!=="known";});
    if(!P.length){toast("Все отмеченные уже известны");return;}
    if(!confirm("Отметить "+P.length+" "+plural(P.length,"слово","слова","слов")+" как известные? Они уйдут из очереди и повторения."))return;
    P.forEach(function(i){markKnown(i,true);});
    S.set.pick=[];save();render();
  },
  unknowPick:function(){
    var P=pickedIdx().filter(function(i){return wStatus(i)==="known";});
    P.forEach(function(i){markKnown(i,false);});
    S.set.pick=[];save();render();toast("Возвращено в изучение: "+P.length);
  },
  ivGo:function(b){var m=b.dataset.m,n=m==="new"?+($("#ivN")||{value:5}).value:15;ivStart(m,n);},
  ivTbl:function(){ivTable=!ivTable;render();},
  ivSay:function(b){ivSayForms(+b.dataset.i);},
  ivSayT:function(b){speak(b.dataset.t);},
  ivIntro:function(){ivIntroNext();},
  ivAns:function(b){ivCheck(b.dataset.v);},
  ivCheck:function(){ivCheck();},
  ivTypo:function(){ivTypo();},
  ivNext:function(){ivNext();},
  ivFin:function(){ivess=null;show("irr");},
  pvGo:function(b){var m=b.dataset.m,n=m==="new"?+($("#pvN")||{value:5}).value:15;pvStart(m,n);},
  pvTbl:function(){pvList=!pvList;render();},
  pvSay:function(b){speak(b.dataset.t);},
  pvIntro:function(){pvIntroNext();},
  pvAns:function(b){pvAnswer(b.dataset.v);},
  pvMis:function(){pvMis();},
  pvNext:function(){pvNext();},
  pvFin:function(){pvess=null;show("phr");},
  typo:function(){acceptTypo();},
  next:function(){nextQ();},
  quit:function(){var back=sess?sess.back:"review";sess=null;show(back);},
  quitLearn:function(){learn=null;show("review");},
  lNext:function(){learnNext();},
  redo:function(){
    var um=[],tp={},i;
    for(i=0;i<sess.mist.length;i++)if(um.indexOf(sess.mist[i])<0)um.push(sess.mist[i]);
    for(i=0;i<sess.qs.length;i++)tp[sess.qs[i].wid]=sess.qs[i].type;
    var title=sess.title,back=sess.back;
    /* только что ошибся — повторение здесь закрепляет, но не возвращает коробку наверх */
    startSession(um.map(function(i){return makeQ(i,tp[i]);}),"train",title+" · ошибки",back);
  },
  fin:function(){var back=sess.back;sess=null;show(back);},
  testV:function(){speak("Hello! I am learning English words.");},
  doExport:function(){
    var t=$("#ioArea");
    t.value=JSON.stringify({w:S.w,p:S.p,x:S.x,daily:S.daily,set:S.set});
    t.select();
    toast("JSON готов — скопируй и сохрани");
  },
  doImport:function(){
    try{
      var d=JSON.parse($("#ioArea").value);
      if(!d||typeof d.w!=="object")throw 0;
      S.w=d.w;if(d.p)S.p=d.p;if(d.x)S.x=d.x;S.daily=d.daily||{};S.set=Object.assign(S.set,d.set||{});
      migAll();
      save();toast("Импортировано");render();
    }catch(e){toast("Не получилось разобрать JSON");}
  },
  doReset:function(){
    if(!resetArm){
      resetArm=true;render();
      setTimeout(function(){resetArm=false;if(view==="set")render();},4000);
    }else{
      resetArm=false;S.w={};S.p={};S.x={iv:{},pv:{}};S.daily={};save();
      toast("Прогресс сброшен");render();
    }
  }
};
/* ================= РОУТЕР ================= */
function show(v){view=v;render();}
function render(){
  var badge=duePairs().length;
  var backMap={catlist:"words",all:"words",learn:"review",session:(sess?sess.back:"review"),szs:"satz",pat:"satz",irs:"irr",phs:"phr"};
  var actV=backMap[view]||view;
  $$(".tab").forEach(function(b){b.classList.toggle("act",b.dataset.v===actV);});
  var bd=$("#dueBadge");
  bd.textContent=badge;
  bd.style.display=badge?"":"none";
  var h="";
  if(view==="review")h=vReview();
  else if(view==="words")h=vWords();
  else if(view==="catlist")h=vCatList();
  else if(view==="all")h=vAll();
  else if(view==="train")h=vTrain();
  else if(view==="satz"){szLoad();h=vSatz();}
  else if(view==="szs")h=vSzs();
  else if(view==="pat")h=vPat();
  else if(view==="irr")h=vIrr();
  else if(view==="irs")h=vIrs();
  else if(view==="phr")h=vPhr();
  else if(view==="phs")h=vPhs();
  else if(view==="stats")h=vStats();
  else if(view==="set")h=vSet();
  else if(view==="learn")h=vLearn();
  else if(view==="session")h=vSession();
  $("#view").innerHTML=h;
  afterRender();
}
function afterRender(){
  if(view==="set"){
    var sel=$("#voiceSel");
    if(sel){fillVoiceSel(sel);sel.onchange=function(){S.set.voice=sel.value;save();};}
    var r=$("#rateRng");
    if(r)r.oninput=function(){S.set.rate=+r.value;$("#rateVal").textContent=S.set.rate.toFixed(2);save();};
    var a=$("#autoCk");
    if(a)a.onchange=function(){S.set.auto=a.checked;save();};
  }
  if(view==="session"&&sess&&sess.i<sess.qs.length&&!sess.ans){
    var q=curQ();
    if(S.set.auto&&(q.type==="mcAuRu"||q.type==="mcAuDe"||q.type==="wrAu"||q.type==="mcDeRu"))autoSpeak(q.wid,250);
    var inp=$("#wInp");
    if(inp){
      inp.onkeydown=function(e){
        if(e.key!=="Enter")return;
        e.preventDefault();
        e.stopPropagation();
        if(!sess.ans)submitWrite();
      };
      inp.onkeyup=function(e){if(e.key==="Enter")e.stopPropagation();};
      setTimeout(function(){inp.focus();},60);
    }
  }
  if(view==="szs"&&szess&&szess.cur&&szess.i<szess.list.length){
    if(!szess.ans&&S.set.auto&&(szess.tr===0||szess.tr===2))
      setTimeout(function(){if(szess&&!szess.ans)szSpeak();},250);
    var si=$("#szInp");
    if(si){
      si.onkeydown=function(e){
        if(e.key!=="Enter")return;
        e.preventDefault();e.stopPropagation();
        if(!szess.ans)szCheckText();
      };
      si.onkeyup=function(e){if(e.key==="Enter")e.stopPropagation();};
      setTimeout(function(){si.focus();},60);
    }
  }
  if(view==="irs"&&ivess&&ivess.q&&!ivess.fb){
    var i1=$("#ivP"),i2=$("#ivPP"),i3=$("#ivS");
    var onEnter=function(e){if(e.key!=="Enter")return;e.preventDefault();e.stopPropagation();
      if(this.id==="ivP"&&i2&&!i2.value.trim()){i2.focus();return;}ivCheck();};
    var stop=function(e){if(e.key==="Enter")e.stopPropagation();};
    [i1,i2,i3].forEach(function(el){if(el){el.onkeydown=onEnter;el.onkeyup=stop;}});
    var f=i1||i3;if(f)setTimeout(function(){f.focus();},60);
    if(S.set.auto&&ivess.q.type!=="sent")setTimeout(function(){if(ivess&&ivess.q&&!ivess.fb)speak(IRV[ivess.q.i][0]);},250);
  }
  if(view==="irs"&&ivess&&ivess.intro&&S.set.auto&&ivess.i<ivess.list.length)
    setTimeout(function(){if(ivess&&ivess.intro)ivSayForms(ivess.list[ivess.i]);},250);
  if(view==="phs"&&pvess&&pvess.intro&&S.set.auto&&pvess.i<pvess.list.length)
    setTimeout(function(){if(pvess&&pvess.intro)speak(pvKey(PHV[pvess.list[pvess.i]]));},250);
  if(view==="all"){
    var si=$("#allSearch");
    if(si){
      var t=null;
      si.oninput=function(){
        allQ=si.value;
        clearTimeout(t);
        /* перерисовка отложена, иначе на слабом телефоне ввод дёргается */
        t=setTimeout(function(){var p=si.selectionStart;render();
          var n=$("#allSearch");if(n){n.focus();try{n.setSelectionRange(p,p);}catch(e){}}},250);
      };
    }
  }
  if(view==="learn"&&learn&&S.set.auto)autoSpeak(learn.list[learn.i],250);
}
document.addEventListener("click",function(e){
  var tb=e.target.closest(".tab");
  if(tb){sess=null;learn=null;show(tb.dataset.v);return;}
  var b=e.target.closest("[data-act]");
  if(!b||b.disabled)return;
  var fn=A[b.dataset.act];
  if(fn)fn(b);
});
document.addEventListener("keydown",function(e){
  if(view==="irs"&&ivess){
    if(ivess.intro){if(e.key==="Enter"){e.preventDefault();ivIntroNext();}return;}
    if(ivess.i>=ivess.list.length){if(e.key==="Enter")A.ivFin();return;}
    if(ivess.fb){if(e.key==="Enter"){e.preventDefault();ivNext();}return;}
    if(ivess.q&&ivess.q.type==="mc"&&["1","2","3","4"].indexOf(e.key)>=0){var o=ivess.q.opts[+e.key-1];if(o)ivCheck(o);}
    return;
  }
  if(view==="phs"&&pvess){
    if(pvess.intro){if(e.key==="Enter"){e.preventDefault();pvIntroNext();}return;}
    if(pvess.i>=pvess.list.length){if(e.key==="Enter")A.pvFin();return;}
    if(pvess.fb){if(e.key==="Enter"){e.preventDefault();pvNext();}return;}
    if(["1","2","3","4"].indexOf(e.key)>=0){var p=pvess.q.opts[+e.key-1];if(p)pvAnswer(p);}
    return;
  }
  if(view!=="session"||!sess)return;
  if(sess.i>=sess.qs.length){if(e.key==="Enter")A.fin();return;}
  var q=curQ();
  if(!sess.ans&&q.type.indexOf("mc")===0&&["1","2","3","4"].indexOf(e.key)>=0){answerChoice(+e.key-1);return;}
  if(sess.ans&&e.key==="Enter"){e.preventDefault();nextQ();}
});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"){clearTimeout(autoT);if(synth)synth.cancel();}
});
loadS().then(function(){render();});
</script>
</body>
</html>
