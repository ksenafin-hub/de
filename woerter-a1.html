/* ================= SRS ================= */
/* Треки: 0 — чтение, 1 — аудирование, 2 — письмо.
   Чтение и письмо опираются на один и тот же образ слова, поэтому промах
   в одном откатывает оба. Аудирование — отдельный навык, отвечает само за себя. */
function linkedTracks(tr){ return tr===1 ? [1] : [0,2]; }

/* Откат на две коробки, но не ниже второй и никогда вверх.
   Срок при этом короткий: промах нужно переспросить в этой же сессии. */
function demote(x,tr,now){
  x.b[tr]=Math.min(x.b[tr],Math.max(2,x.b[tr]-2));
  x.d[tr]=now+IV[1];
}

function applyAns(i,ti,ok,mode){
  var x=ws(i),now=Date.now(),tr=ti>>1;
  var wasNew=(x.b[0]+x.b[1]+x.b[2]===0);
  x.a[ti]++;if(ok)x.c[ti]++;
  dlog(ok);
  if(window.myDE)window.myDE.logAnswer("woerter",{item:kid(i),track:tr,mode:TYPES[ti],correct:ok});

  /* В тренировке коробки не двигаются ни вверх, ни вниз — только статистика. */
  if(mode==="train"){save();return;}

  if(ok){
    if(x.b[tr]===0){x.b[tr]=1;x.d[tr]=now+IV[1];}
    else if(mode==="review"||now>=x.d[tr]){x.b[tr]=Math.min(6,x.b[tr]+1);x.d[tr]=now+IV[x.b[tr]];}
    x.str++;
  }else{
    x.lap++;x.str=0;
    var L=linkedTracks(tr);
    for(var k=0;k<L.length;k++)if(x.b[L[k]]>0)demote(x,L[k],now);
    if(x.b[tr]===0){x.b[tr]=1;x.d[tr]=now+IV[1];}
  }
  if(wasNew&&x.b[0]+x.b[1]+x.b[2]>0)dnew();
  save();
}
/* Слово с несколькими просроченными треками даёт несколько записей в очереди.
   Простая перетасовка их слипает: в 75% сессий одно и то же слово шло подряд.
   Раздаём по кругам — внутри круга каждое слово ровно один раз. */
function spreadPairs(d){
  var by={},ids=[],k;
  for(k=0;k<d.length;k++){
    var id=d[k].i;
    if(!by[id]){by[id]=[];ids.push(id);}
    by[id].push(d[k]);
  }
  for(k=0;k<ids.length;k++)shuffle(by[ids[k]]);
  var out=[];
  while(out.length<d.length){
    var round=ids.filter(function(x){return by[x].length;});
    if(!round.length)break;
    shuffle(round);
    /* не начинать круг тем словом, которым закончился предыдущий */
    if(out.length&&round.length>1&&round[0]===out[out.length-1].i){
      var t=round[0];round[0]=round[1];round[1]=t;
    }
    for(k=0;k<round.length;k++)out.push(by[round[k]].shift());
  }
  return out;
}
function duePairs(){
  var now=Date.now(),r=[];
  for(var i=0;i<W.length;i++){
    var x=wg(i);if(!x)continue;
    for(var t=0;t<3;t++)if(x.b[t]>=1&&x.d[t]<=now)r.push({i:i,t:t});
  }
  return r;
}
function newIn(cat){
  var r=[];
  for(var i=0;i<W.length;i++){
    if(cat!=="all"&&W[i][4]!==cat)continue;
    var x=wg(i);if(!x||x.b[0]+x.b[1]+x.b[2]===0)r.push(i);
  }
  /* сначала то, без чего не собрать фразу на экзамене */
  r.sort(function(p,q){return (RK[p]||999)-(RK[q]||999);});
  return r;
}

function typeForTrack(t,b){

/* ================= ВОПРОСЫ ================= */
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function distract(i,n){
  var w=W[i],pool=[],j;
  for(j=0;j<W.length;j++){if(j!==i&&W[j][4]===w[4]&&W[j][3]!==w[3])pool.push(j);}
  shuffle(pool);
  if(pool.length<n){
    var extra=[];
    for(j=0;j<W.length;j++){if(j!==i&&W[j][3]!==w[3]&&pool.indexOf(j)<0)extra.push(j);}
    shuffle(extra);
    while(pool.length<n&&extra.length)pool.push(extra.pop());
  }
  return pool.slice(0,n);
}
function makeQ(i,type){
  var q={wid:i,type:type};
  if(type.indexOf("mc")===0){
    var opts=distract(i,3).map(function(j){return {wid:j};});
    opts.push({wid:i});
    shuffle(opts);
    q.opts=opts;
  }
  return q;
}
function norm(s){
  return String(s).toLowerCase().trim()
    .replace(/[.,!?«»']/g,"")
    .replace(/é/g,"e")
    .replace(/-/g,"")
    .replace(/\s+/g," ")
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
}
function checkWrite(i,inp){
  var w=W[i],v=norm(inp||"");
  if(!v)return {ok:false};
  var base=norm(w[1]);
  if(w[0]){
    if(v===norm(w[0]+" "+w[1]))return {ok:true};
    if(v===base)return {ok:true,noArt:true};
    var arts=["der","die","das"];
    for(var k=0;k<3;k++){if(arts[k]!==w[0]&&v===norm(arts[k]+" "+w[1]))return {ok:false,badArt:true};}
    return {ok:false};
  }
  return {ok:v===base};
}

function acceptTypo(){
  var u=sess&&sess.undo;
  if(!u||u.wasOk)return;
  var x=ws(u.wid),snap=JSON.parse(u.snap),k;
  for(k in snap)x[k]=snap[k];          /* состояние слова до ответа */
  var d=drec();d.a--;                   /* и дневная статистика */
  var ix=sess.mist.lastIndexOf(u.wid);

      +'</div></div>'+triHtml(j)+'</div>';

/* ================= ТРЕНАЖЁР ЧИСЕЛ ================= */

var NUM_O=["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun"];
var NUM_T=["zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
var NUM_Z=["","","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"];

/* 0..999 — без слова «тысяча» */
function numSub(n){
  if(n===0)return "";
  if(n<10)return NUM_O[n];
  if(n<20)return NUM_T[n-10];
  if(n<100){
    var u=n%10,t=Math.floor(n/10);
    return u?((u===1?"ein":NUM_O[u])+"und"+NUM_Z[t]):NUM_Z[t];
  }
  var h=Math.floor(n/100),r=n%100;
  return (h===1?"ein":NUM_O[h])+"hundert"+(r?numSub(r):"");
}
function numWord(n){
  n=Math.round(n);
  if(n===0)return "null";
  if(n<1000)return numSub(n);
  var th=Math.floor(n/1000),r=n%1000;
  return (th===1?"ein":numSub(th))+"tausend"+(r?numSub(r):"");
}

/* Пишут слитно, но учащийся может поставить пробелы или дефисы — принимаем. */
function numNorm(s){
  return String(s).toLowerCase()
    .replace(/[\s\-.,]/g,"")
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
}
/* «hundert» и «einhundert» одинаково правильны, то же с тысячей */
function numAccept(n){
  var a=numWord(n),v=[a];
  if(/^einhundert/.test(a))v.push(a.replace(/^einhundert/,"hundert"));
  if(/^eintausend/.test(a))v.push(a.replace(/^eintausend/,"tausend"));
  var out={};for(var k=0;k<v.length;k++)out[numNorm(v[k])]=1;
  return out;
}

function numState(){
  if(!S.num)S.num={a:0,c:0,miss:{},min:0,max:100,mode:"hear"};
  if(S.num.min===undefined){S.num.min=0;S.num.max=100;S.num.mode="hear";}
  if(!S.num.miss)S.num.miss={};
  return S.num;
}

var numQ=null,numFb=null;

/* Треть вопросов берём из ранее проваленных — иначе слабые места не закрываются. */
function numPick(){
  var st=numState(),lo=Math.min(st.min,st.max),hi=Math.max(st.min,st.max);
  var pool=[];
  for(var k in st.miss){var v=+k;if(v>=lo&&v<=hi&&st.miss[k]>0)pool.push(v);}
  if(pool.length&&Math.random()<0.34)return pool[Math.floor(Math.random()*pool.length)];
  return lo+Math.floor(Math.random()*(hi-lo+1));
}
function numNew(){
  numQ={n:numPick()};
  numFb=null;
  render();
  if(numState().mode==="hear")setTimeout(numSay,220);
}
function numSay(){ if(numQ)speak(numWord(numQ.n)); }
function numCheck(){
  if(!numQ||numFb)return;
  var st=numState(),inp=$("#numInp"),val=inp?inp.value:"",ok;
  if(st.mode==="hear"){
    ok=String(val).replace(/\s/g,"")===String(numQ.n);
  }else{
    ok=!!numAccept(numQ.n)[numNorm(val)];
  }
  st.a++;if(ok)st.c++;
  var key=String(numQ.n);
  if(ok){ if(st.miss[key])st.miss[key]--; }
  else  { st.miss[key]=(st.miss[key]||0)+1; }
  numFb={ok:ok,given:val};
  dlog(ok);
  save();
  render();
}

function prepState(){

var prepQ=null,prepFb=null;

function prepOpts(correct,pool,n){
  var o=[correct],guard=0;
  while(o.length<n&&guard++<200){
    var c=pool[Math.floor(Math.random()*pool.length)];
    if(o.indexOf(c)<0)o.push(c);
  }
  return shuffle(o);
}

function prepNew(){
  var st=prepState(),m=st.mode,mk;
  /* треть вопросов — из тех, где ошибался */
  var pool=[];for(var k in st.miss)if(st.miss[k]>0&&k.indexOf(m+"|")===0)pool.push(k);
  var forced=(pool.length&&Math.random()<0.34)?pool[Math.floor(Math.random()*pool.length)]:null;

  if(m==="case"){
    var it=forced?PREP_CASE.filter(function(x){return m+"|"+x[0]===forced;})[0]:null;
    if(!it)it=PREP_CASE[Math.floor(Math.random()*PREP_CASE.length)];
    mk={key:m+"|"+it[0],q:it[0],ans:it[1],opts:["Dativ","Akkusativ","двойной"],hint:"Какой падеж требует предлог?"};
  }else if(m==="gap"){
    var g=forced?PREP_GAP.filter(function(x){return m+"|"+x[0]+x[1]===forced;})[0]:null;
    if(!g)g=PREP_GAP[Math.floor(Math.random()*PREP_GAP.length)];
    var all=PREP_CASE.map(function(x){return x[0];});
    mk={key:m+"|"+g[0]+g[1],pre:g[0],ans:g[1],post:g[2],ru:g[3],
        opts:prepOpts(g[1],all,4),hint:"Какой предлог подходит?"};
  }else if(m==="ww"){
    var v=forced?PREP_WW.filter(function(x){return m+"|"+x[0]+x[1]===forced;})[0]:null;
    if(!v)v=PREP_WW[Math.floor(Math.random()*PREP_WW.length)];
    mk={key:m+"|"+v[0]+v[1],pre:v[0],ans:v[1],post:v[2],ru:v[4],tag:v[3],
        opts:prepOpts(v[1],["dem","den","das","der","die"],4),
        hint:"Wo? — Dativ (покой) · Wohin? — Akkusativ (движение)"};
  }else if(m==="time"){
    var tt=forced?PREP_TIME.filter(function(x){return m+"|"+x[0]+x[1]===forced;})[0]:null;
    if(!tt)tt=PREP_TIME[Math.floor(Math.random()*PREP_TIME.length)];
    mk={key:m+"|"+tt[0]+tt[1],pre:tt[0],ans:tt[1],post:tt[2],ru:tt[3],
        opts:prepOpts(tt[1],["um","am","Am","im","Im","bis","seit","Ab","gegen","Nach","Vor"],4),
        hint:"um — точное время · am — день и часть суток · im — месяц и время года"};
  }else{
    var mg=forced?PREP_MERGE.filter(function(x){return m+"|"+x[0]+x[1]===forced;})[0]:null;
    if(!mg)mg=PREP_MERGE[Math.floor(Math.random()*PREP_MERGE.length)];
    mk={key:m+"|"+mg[0]+mg[1],q:mg[0]+" + "+mg[1],ans:mg[2],
        opts:prepOpts(mg[2],["im","ins","am","ans","zum","zur","beim","vom"],4),
        hint:"Как звучит слитная форма?"};

  prepQ=mk;prepFb=null;render();
}

    t.value=JSON.stringify({w:S.w,daily:S.daily,set:S.set});
    t.select();
    toast("JSON готов — скопируй и сохрани");
  },
  doImport:function(){
    try{
      var d=JSON.parse($("#ioArea").value);
      if(!d||typeof d.w!=="object")throw 0;
      S.w=d.w;S.daily=d.daily||{};S.set=Object.assign(S.set,d.set||{});
      migAll();
      save();toast("Импортировано");render();
    }catch(e){toast("Не получилось разобрать JSON");}
  },
  doReset:function(){
    if(!resetArm){
      resetArm=true;render();
      setTimeout(function(){resetArm=false;if(view==="set")render();},4000);
    }else{
      resetArm=false;S.w={};S.daily={};save();
      toast("Прогресс сброшен");render();
    }
  }
};
/* ================= РОУТЕР ================= */
function show(v){view=v;render();}
function render(){
  var badge=duePairs().length;
  var backMap={catlist:"words",all:"words",learn:"review",session:(sess?sess.back:"review")};
  var actV=backMap[view]||view;
  $$(".tab").forEach(function(b){b.classList.toggle("act",b.dataset.v===actV);});
  var bd=$("#dueBadge");
  bd.textContent=badge;
  bd.style.display=badge?"":"none";
  var h="";
  if(view==="review")h=vReview();
  else if(view==="words")h=vWords();
  else if(view==="catlist")h=vCatList();
  else if(view==="all")h=vAll();
  else if(view==="train")h=vTrain();
  else if(view==="num")h=vNum();
  else if(view==="prep")h=vPrep();
  else if(view==="stats")h=vStats();
  else if(view==="set")h=vSet();
  else if(view==="learn")h=vLearn();
  else if(view==="session")h=vSession();
  $("#view").innerHTML=h;
  afterRender();
}
function afterRender(){
  if(view==="set"){
    var sel=$("#voiceSel");
    if(sel){fillVoiceSel(sel);sel.onchange=function(){S.set.voice=sel.value;save();};}
    var r=$("#rateRng");
    if(r)r.oninput=function(){S.set.rate=+r.value;$("#rateVal").textContent=S.set.rate.toFixed(2);save();};
    var a=$("#autoCk");
    if(a)a.onchange=function(){S.set.auto=a.checked;save();};
  }
  if(view==="session"&&sess&&sess.i<sess.qs.length&&!sess.ans){
    var q=curQ();
    if(S.set.auto&&(q.type==="mcAuRu"||q.type==="mcAuDe"||q.type==="wrAu"||q.type==="mcDeRu"))autoSpeak(q.wid,250);
    var inp=$("#wInp");
    if(inp){
      inp.onkeydown=function(e){
        if(e.key!=="Enter")return;
        e.preventDefault();
        e.stopPropagation();
        if(!sess.ans)submitWrite();
      };
      inp.onkeyup=function(e){if(e.key==="Enter")e.stopPropagation();};
      setTimeout(function(){inp.focus();},60);
    }
  }
  if(view==="num"){
    var ni=$("#numInp");
    if(ni&&!numFb){
      ni.focus();
      ni.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();e.stopPropagation();numCheck();}};
    }
    var mn=$("#numMin"),mx=$("#numMax");
    if(mn)mn.onchange=function(){numState().min=+mn.value||0;save();render();};
    if(mx)mx.onchange=function(){numState().max=+mx.value||0;save();render();};
  }
  if(view==="all"){
    var si=$("#allSearch");
    if(si){
      var t=null;
      si.oninput=function(){
        allQ=si.value;
        clearTimeout(t);
        /* перерисовка отложена, иначе на слабом телефоне ввод дёргается */
        t=setTimeout(function(){var p=si.selectionStart;render();
          var n=$("#allSearch");if(n){n.focus();try{n.setSelectionRange(p,p);}catch(e){}}},250);
      };
    }
  }
  if(view==="learn"&&learn&&S.set.auto)autoSpeak(learn.list[learn.i],250);
}
document.addEventListener("click",function(e){
  var tb=e.target.closest(".tab");
  if(tb){sess=null;learn=null;show(tb.dataset.v);return;}
  var b=e.target.closest("[data-act]");
  if(!b||b.disabled)return;
  var fn=A[b.dataset.act];
  if(fn)fn(b);
});
document.addEventListener("keydown",function(e){
  if(view==="num"){
    if(e.key==="Enter"){e.preventDefault();if(numFb)numNew();else numCheck();}
    return;
  }
  if(view==="prep"){
    if(e.key==="Enter"&&prepFb){e.preventDefault();prepNew();}
    return;
  }
  if(view!=="session"||!sess)return;
  if(sess.i>=sess.qs.length){if(e.key==="Enter")A.fin();return;}
  var q=curQ();
  if(!sess.ans&&q.type.indexOf("mc")===0&&["1","2","3","4"].indexOf(e.key)>=0){answerChoice(+e.key-1);return;}
  if(sess.ans&&e.key==="Enter"){e.preventDefault();nextQ();}
});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"){clearTimeout(autoT);if(synth)synth.cancel();}
});
loadS().then(function(){render();});
</script>
</body>
</html>
